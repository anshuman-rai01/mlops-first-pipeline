# CI Workflow
# Github Actions workflow for continuous integration (CI) of the MLOps first pipeline project.
# Github automatcally looks for workflow files inside .github/workflows directory of the repository.

#Give workflow a meaningful name
name: Iris ML API - CI Pipeline

# Define when github should run the workflow. In this case, it will run on push and pull request events to the main branch.

on:
  # Run CI whenever code is pushed to the main branch.
  push:
    branches:
      - main

  # Also validate proposed changes before they are merged into the main branch.
  pull_request:
    branches:
      - main


# Permissions are restricted to reading repo content only
permissions:
  contents: read

# Define teh jobs that make up the pipiline.

jobs:
  test-and-build:
    # Github provides a fresh Ubuntu virtual machine for this job.
    runs-on: ubuntu-latest

    # steps
    steps:
       #  step 1: Download the repo content to the runner
      - name: Check out repository
        uses: actions/checkout@v4

      # step 2: Set up Python environment on runner 
      - name: Install python on Runner
        uses: actions/setup-python@v5
        with : 
          python-version: "3.14"
      
      # step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # step 4: Execute the automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # Step 5: Build the Docker image only after the tests have passed successfully
      - name: Build Docker Image
        run: docker build -t iris-ml-api:${{github.sha}} .
